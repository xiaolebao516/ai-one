name: CI

# Opt-in checks: PR reviews are not blocked by automatically triggered CI.
# Run from Actions > CI > Run workflow and select a branch + suite.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'quick = JS/TS/agent/adapters; full = quick + Rust'
        type: choice
        required: true
        default: quick
        options:
          - quick
          - full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm verify already includes injected build, TS, lint, vitest, agent tests and adapter validation.
      - run: pnpm verify

  cargo-clippy:
    if: inputs.suite == 'full'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
        with:
          components: clippy
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Rust embeds generated JS during compilation.
      - run: pnpm build:injected
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
